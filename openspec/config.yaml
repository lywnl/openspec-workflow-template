schema: spec-driven

context: |
  本项目使用通用中文 OpenSpec 工作流。
  先读取 AGENTS.md 和 .agents/shared/openspec/workflow-policy.md。
  按实际风险选择 fast、standard 或 strict；workflow_profile 记录在变更元数据中。
  技术栈、工程命令和环境来自当前项目事实，不预设框架、包管理器、数据库或部署平台。
  规划正文使用简体中文，保留 CLI、schema 与解析器要求的字段和结构关键字。
  用户授权、工作目录和真实验收边界遵循共享规则。

rules:
  proposal:
    - 说明目标、范围、非目标、影响与真实来源；没有外部文档时注明对话或代码依据。
  specs:
    - 使用可观察行为和可验证场景，保留 Requirement、Scenario 等规范结构标记。
  design:
    - 技术决策基于实际项目，覆盖适用的兼容性、失败路径和风险，不为模板虚构架构。
  tasks:
    - 标准 Markdown 任务只把必需工作写为 checkbox，说明依赖、实现范围和验证方式；不适用项说明原因。自定义 schema 使用其他格式时遵循其状态语义，并按共享规则选择核验方式。
    - 生成任务不代表已经实施或验收，不能预先勾选。
