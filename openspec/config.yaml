schema: spec-driven

context: |
  本项目使用通用中文 OpenSpec 工作流。
  先读取 AGENTS.md 和 .agents/shared/openspec/workflow-policy.md。
  按实际风险选择 fast、standard 或 strict，元数据读写遵循共享工作流规则中的兼容约定。
  根默认 spec-driven；新建 fast 显式选择 fast-change，仅生成 proposal/tasks 并声明 skip_specs: true。
  fast 仅用于不改变规范约定的低风险调整；普通功能或行为变化使用 standard，高风险边界使用 strict。
  standard/strict 按 spec-driven 实际依赖生成 proposal、specs、design、tasks；已有或显式 schema 选择应保留并核对兼容性。
  技术栈、工程命令和环境来自当前项目事实，不预设框架、包管理器、数据库或部署平台。
  规划正文使用简体中文，保留 CLI、schema 与解析器要求的字段和结构关键字。
  用户授权、工作目录和真实验收边界遵循共享规则。
  默认每次生成一个就绪规划产物后停止，规划齐备只提示评审入口；明确授权才连续推进。
  已读取且未变化的规则按需复用，不因切换产物重复扫描；新需求或更改已确认行为先询问。

rules:
  proposal:
    - 说明目标、范围、非目标、影响与真实来源；按 .agents/shared/openspec/sources.md 维护 Source Inputs 表，登记编号、位置、类型或确认状态、采纳范围及替代关系。
    - standard/strict 承接 sources/user-request.md；fast 简单来源可直接登记在 proposal。对话也是来源，没有 sources 目录不能跳过来源核对。
    - 不展开完整实现方案或复制规则原文。
  specs:
    - 使用可观察行为和可验证场景，保留 Requirement、Scenario 等规范结构标记。
  design:
    - 技术决策基于实际项目，覆盖适用的兼容性、失败路径和风险，不为模板虚构架构。
    - 引用已有 Requirement 和 Scenario 名称，只展开技术取舍，不重复抄写需求。
  tasks:
    - 标准 Markdown 任务只把必需工作写为 checkbox，说明依赖、实现范围和验证方式；不适用项说明原因。自定义 schema 使用其他格式时遵循其状态语义，并按共享规则选择核验方式。
    - 生成任务不代表已经实施或验收，不能预先勾选。
    - 用任务编号引用需求和设计；原始证据统一索引，不固定要求逐任务独立 Markdown 报告。
    - checkbox 记录实现和具体验证；正式验收结论、验收指纹和归档写为交付条件，不形成进入验收的循环前置任务。
